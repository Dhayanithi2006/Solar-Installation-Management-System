[options]
; ==============================================================================
; SunPower Solutions — Odoo 18.0 Production Configuration
; ==============================================================================

; Addons Paths
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Data Directory & Filestore
data_dir = /var/lib/odoo

; Master Password for Database Operations
admin_passwd = admin_secret_sunpower_2026

; Database Server Credentials
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_pass_2026
db_name = sunpower_dev
db_maxconn = 64

; HTTP & Reverse Proxy Settings
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; Multiprocessing & Performance Limits (Production Tuning)
workers = 0
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192

; Logging Configuration
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = [':INFO']
log_db = False
